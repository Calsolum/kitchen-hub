server {
    listen 80;
    server_name kitchen.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kitchen.local;
    ssl_certificate /etc/nginx/certs/kitchen.crt;
    ssl_certificate_key /etc/nginx/certs/kitchen.key;

    # Every route lives in kitchen-locations.inc so the kiosk's name and the Tailscale name serve the same thing.
    include /etc/nginx/kitchen-locations.inc;
}

# The phone app (and anything else on the tailnet) reaches the hub at this name. Its certificate comes
# from `tailscale cert` (see kitchen-tscert.sh, run weekly). Served here rather than via
# `tailscale serve` so clients keep their own 100.x address and power_server.py still refuses them.
server {
    listen 443 ssl;
    server_name kitchen.your-tailnet.ts.net;
    ssl_certificate /etc/nginx/ts/ts.crt;
    ssl_certificate_key /etc/nginx/ts/ts.key;

    include /etc/nginx/kitchen-locations.inc;
}
