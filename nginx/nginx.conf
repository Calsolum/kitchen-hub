server {
    listen 80;
    server_name kitchen.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kitchen.local;
    ssl_certificate /etc/nginx/certs/kitchen.crt;
    ssl_certificate_key /etc/nginx/certs/kitchen.key;

    location /dashboard/ {
        proxy_pass http://host.docker.internal:8080/;
        proxy_set_header Host $host;
    }

    location /whisper/ {
        proxy_pass http://whisper:9100/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /calendar/ {
        proxy_pass http://host.docker.internal:9200/;
        proxy_set_header Host $host;
    }

    location /mealie/ {
        proxy_pass http://mealie:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://grocy:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
